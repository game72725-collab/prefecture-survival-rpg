<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>都道府県サバイバルRPG（仮）Phase2B：東京都テスト</title>
<style>
  :root{ --bg:#1b2430; --ui:#0f1620; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin:0; padding:0; height:100%;
    background: var(--bg);
    overscroll-behavior: none;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    color:#fff;
  }
  #app {
    max-width: 480px; margin: 0 auto; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column; position: relative;
  }
  #hud {
    background: var(--ui); padding: 10px 14px;
    display:flex; justify-content:space-between; align-items:center;
    font-weight:bold; font-size: 16px; border-bottom: 2px solid #000;
  }
  #timer.low { color: #ff5a5a; }
  #canvasWrap { flex: 1; position: relative; overflow: hidden; background: #0d2436; }
  canvas { display:block; width:100%; height:100%; }

  #layerToggles {
    position:absolute; left:10px; top:50px; z-index:11;
    background: rgba(15,22,32,0.78); border:1px solid #566c85; border-radius:8px;
    padding:5px 8px; font-size:11px; line-height:1.6; color:#dbe4ee;
    -webkit-user-select:none; user-select:none;
  }
  #layerToggles label { display:flex; align-items:center; gap:4px; white-space:nowrap; cursor:pointer; }
  #layerToggles input { margin:0; width:12px; height:12px; }
  #boostHud {
    position:absolute; left:10px; top:10px; z-index:12; display:none; align-items:center; gap:6px;
    background: rgba(15,22,32,0.85); border:1px solid #ffd93d; border-radius:10px; padding:6px 10px; font-size:14px;
  }
  #boostHud.show { display:flex; }
  #boostBarWrap { width:70px; height:8px; background:#2b3644; border-radius:4px; overflow:hidden; }
  #boostBar { height:100%; width:100%; background:#ffd93d; }
  #boostSec { min-width:24px; font-variant-numeric: tabular-nums; }
  #hintBanner {
    position:absolute; left:10px; right:10px; bottom:10px;
    background: rgba(15,22,32,0.92); border:1px solid #5ecb63;
    border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height:1.4;
    display:none; z-index: 15;
  }
  #hintBanner.show { display:block; }
  #hintBanner b { color:#5ecb63; }

  /* ヒント掲示板を読んだ時の半透明パネル（操作・タイマーは止めない。タップか一定時間で閉じる） */
  #hintPanel {
    position:absolute; left:10px; right:10px; bottom:66px; max-height:32%; overflow-y:auto;
    background: rgba(15,22,32,0.74); border:1px solid #ffd93d; border-radius:10px;
    padding: 9px 12px; font-size: 13px; line-height:1.5; display:none; z-index: 16;
  }
  #hintPanel.show { display:block; }
  #hintPanel b { color:#ffd93d; }
  #hintPanelNote { display:block; margin-top:4px; font-size:10px; opacity:0.6; }

  /* ヒント一覧（HUDのボタンから開く。独立した機能なので不要なら下のCSSとHTMLごと削除可） */
  #hintListBtn {
    background:#3a4c60; border:1px solid #566c85; color:#fff; border-radius:8px;
    padding:4px 10px; font-size:13px; font-weight:bold;
  }
  #hintListBtn:active { background:#566c85; }
  #hintListPanel {
    position:absolute; left:10px; right:10px; top:8px; max-height:62%; overflow-y:auto;
    background: rgba(15,22,32,0.9); border:1px solid #566c85; border-radius:10px;
    padding: 10px 12px; font-size: 13px; line-height:1.5; display:none; z-index: 17;
  }
  #hintListPanel.show { display:block; }
  #hintListPanel h3 { margin:0 0 6px; font-size:14px; color:#ffd93d; }
  .hintListItem { padding:6px 0; border-top:1px solid rgba(255,255,255,0.12); }
  #hintListClose {
    display:block; margin:8px auto 0; background:#3a4c60; border:1px solid #566c85; color:#fff;
    border-radius:8px; padding:6px 22px; font-size:13px;
  }

  #controls {
    background: var(--ui); padding: 14px 14px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex; justify-content:center;
  }
  #dpad { width: 150px; height: 150px; position: relative; }
  .dbtn {
    position: absolute; width: 50px; height: 50px;
    background: #3a4c60; border: 2px solid #566c85; border-radius: 10px;
    display:flex; align-items:center; justify-content:center;
    font-size: 22px; color:#fff; touch-action: none;
  }
  .dbtn:active, .dbtn.active { background: #5ecb63; }
  #up { top:0; left:50px; } #down { top:100px; left:50px; }
  #left { top:50px; left:0; } #right { top:50px; left:100px; }

  .overlay {
    position:absolute; inset:0; background: rgba(10,14,20,0.94);
    display:none; flex-direction:column; align-items:center; justify-content:center;
    padding: 24px; text-align:center; z-index: 20;
  }
  .overlay.show { display:flex; }
  .overlay h1 { font-size: 30px; margin-bottom: 10px; }
  .overlay p { opacity:0.8; margin-bottom: 18px; }
  .bigbtn {
    background: #5ecb63; color:#0f1620; border:none;
    padding: 14px 26px; font-size: 17px; font-weight:bold; border-radius: 10px; margin-top: 10px;
  }
  #quizBox { width:100%; max-width: 380px; }
  #quizBox h2 { font-size: 19px; margin-bottom: 18px; }
  .quizOption {
    display:block; width:100%; background:#3a4c60; border:2px solid #566c85; color:#fff;
    padding: 14px; margin-bottom: 10px; border-radius: 10px; font-size: 15px; text-align:left;
  }
  .quizOption:active { background:#566c85; }
  #fiftyFiftyBtn {
    display:none; width:100%; background:#3a4c60; border:2px solid #ffd93d; color:#ffd93d;
    padding: 10px; margin-top: 4px; border-radius: 10px; font-size: 14px; font-weight:bold;
  }
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div>⏱ <span id="timer">90</span>秒</div>
    <button id="hintListBtn" type="button">💡 ヒント(0)</button>
    <div>📦 <span id="chestCount">0</span>/<span id="chestTotal">4</span></div>
  </div>

  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="layerToggles">
      <label><input type="checkbox" id="toggleTexture" checked> 地形テクスチャ</label>
      <label><input type="checkbox" id="toggleRail" checked> 鉄道</label>
      <label><input type="checkbox" id="toggleRiver" checked> 河川</label>
    </div>
    <div id="boostHud"><span>👟</span><div id="boostBarWrap"><div id="boostBar"></div></div><span id="boostSec"></span></div>
    <div id="hintBanner"></div>
    <div id="hintPanel"><b>💡 ヒント</b><br><span id="hintPanelText"></span><span id="hintPanelNote">タップで閉じる</span></div>
    <div id="hintListPanel">
      <h3>読んだヒント</h3>
      <div id="hintListBody"></div>
      <button id="hintListClose" type="button">閉じる</button>
    </div>

    <div id="loadingOverlay" class="overlay show">
      <p id="loadingMsg">読み込み中…</p>
    </div>
    <div id="quizOverlay" class="overlay">
      <div id="quizBox">
        <h2 id="quizQuestion"></h2>
        <div id="quizOptions"></div>
        <button id="fiftyFiftyBtn" type="button">✂️ 50-50（2択にする）</button>
      </div>
    </div>
    <div id="gameOverOverlay" class="overlay">
      <h1>GAME OVER</h1>
      <p>時間切れです。もう一度挑戦しますか？</p>
      <button class="bigbtn" onclick="resetGame()">もう一度プレイ</button>
    </div>
    <div id="clearOverlay" class="overlay">
      <h1>STAGE CLEAR!</h1>
      <p>県庁クイズに正解しました。</p>
      <button class="bigbtn" onclick="resetGame()">もう一度プレイ</button>
    </div>
    <div id="wrongToast" class="overlay" style="background:rgba(255,90,90,0.9); display:none;">
      <h1>不正解！</h1>
      <p>残り時間 -15秒</p>
    </div>
  </div>

  <div id="controls">
    <div id="dpad">
      <div class="dbtn" id="up">▲</div>
      <div class="dbtn" id="left">◀</div>
      <div class="dbtn" id="right">▶</div>
      <div class="dbtn" id="down">▼</div>
    </div>
  </div>

</div>

<!-- 読み込み順が重要：ESモジュールは使わず通常のscriptタグで読み込む。
     data_prefs.js（全国共通の県境データ）→ main.js（CONFIG・canvas/ctx・ワールド座標の宣言・stateなどの土台）
     → terrain.js → player.js → items.js → ui.js の順。
     県ごとのデータ（data/pref<XX>/ の data_mesh.js・rail_data.js・river_data.js・knowledge_<XX>.js）は、
     ここでは読み込まず、下の loadPrefectureData() でゲーム開始時に動的に読み込む。ゲームの開始処理は main.js の startGame()。 -->
<script src="data_prefs.js"></script>
<script src="main.js"></script>
<script src="terrain.js"></script>
<script src="player.js"></script>
<script src="items.js"></script>
<script src="ui.js"></script>

<script>
// ==== 都道府県データの動的読み込み ====
// loadPrefectureData(13) → data/pref13/ の data_mesh.js・rail_data.js・river_data.js・knowledge_13.js を
// <script>タグで追加し、4ファイルすべての読み込みが終わったら resolve する Promise を返す。
// フォルダ名は 'pref' + 2桁ゼロ埋めのコード（1 → pref01、13 → pref13）。県名はフォルダ名・ファイル名に使わない。
// いずれかの読み込みが失敗したら、console.error に失敗したファイルのパスを出して reject する（呼び出し側が画面にエラー表示）。
// 注意：県データのファイルはトップレベルの const で変数を定義している（変更しない方針）ため、
//       1回のページ表示で読み込めるのは1つの県だけ（別の県を読むとconstの再宣言エラーになる）。
//       別の県に切り替えるときは、ページを読み込み直してから別のコードで呼ぶこと。
var loadedPrefCode = null;

// KNOWLEDGE_<XX> を取り出す。window[...] に無い場合（const/let で宣言されたファイルはwindowのプロパティにならない）は、
// グローバルのレキシカル環境から名前で取り出す。XXは検証済みの2桁数字のみなので、組み立てた式は安全。
function getKnowledgeGlobal(xx){
  var name = 'KNOWLEDGE_' + xx;
  if(typeof window[name] !== 'undefined') return window[name];
  try { return (new Function('return typeof ' + name + ' !== "undefined" ? ' + name + ' : undefined;'))(); }
  catch(e){ return undefined; }
}

function loadPrefectureData(prefCode){
  return new Promise(function(resolve, reject){
    var code = Number(prefCode);
    if(!Number.isInteger(code) || code < 1 || code > 47){
      reject(new Error('都道府県コードが不正です: ' + prefCode)); return;
    }
    if(loadedPrefCode !== null){
      if(loadedPrefCode === code){ resolve(code); }
      else { reject(new Error('このページでは県コード ' + loadedPrefCode + ' のデータを読み込み済みです。別の県はページを読み込み直してください。')); }
      return;
    }
    var xx = String(code).padStart(2, '0');
    var dir = 'data/pref' + xx + '/';
    var files = ['data_mesh.js', 'rail_data.js', 'river_data.js', 'knowledge_' + xx + '.js'];
    var remaining = files.length, failed = false;
    function fail(msg){ failed = true; reject(new Error(msg)); }
    files.forEach(function(name){
      var path = dir + name;
      var sc = document.createElement('script');
      sc.src = path;
      sc.async = false; // 追加した順に実行されるようにする
      sc.onload = function(){
        if(failed) return;
        remaining--;
        if(remaining > 0) return;
        // 4ファイルがそろった：必要な変数が定義されているか確認
        if(typeof TOKYO_RING === 'undefined' || typeof CAPITAL === 'undefined' || typeof MESH_RUNS_FLAT === 'undefined' ||
           typeof RAIL_ROUTES === 'undefined' || typeof riverData === 'undefined'){
          console.error('[loadPrefectureData] ' + dir + ' のデータの中身が想定と違います（data_mesh.js / rail_data.js / river_data.js）');
          fail(dir + ' のデータの中身が想定と違います'); return;
        }
        // KNOWLEDGE_<XX> を取り出し、検証を通った問題を currentKnowledge（main.js）に格納する
        var rawKnowledge = getKnowledgeGlobal(xx);
        if(!Array.isArray(rawKnowledge)){
          console.error('[loadPrefectureData] ' + dir + 'knowledge_' + xx + '.js に KNOWLEDGE_' + xx + '（配列）がありません');
          fail('KNOWLEDGE_' + xx + ' が見つかりません（' + dir + 'knowledge_' + xx + '.js）'); return;
        }
        var validCount = setCurrentKnowledge(code, rawKnowledge);
        if(validCount === 0){
          console.error('[loadPrefectureData] KNOWLEDGE_' + xx + ' に有効な問題がありません');
          fail('KNOWLEDGE_' + xx + ' に有効な問題がありません'); return;
        }
        loadedPrefCode = code;
        resolve(code);
      };
      sc.onerror = function(){
        if(failed) return;
        console.error('[loadPrefectureData] 読み込みに失敗しました: ' + path);
        fail(path + ' を読み込めませんでした');
      };
      document.head.appendChild(sc);
    });
  });
}

// 現時点では東京都（コード13）で開始する。
loadPrefectureData(13).then(function(){
  startGame();
}).catch(function(err){
  console.error(err);
  var m = document.getElementById('loadingMsg');
  if(m) m.textContent = '読み込みに失敗しました：' + err.message;
  var o = document.getElementById('loadingOverlay');
  if(o) o.classList.add('show');
});
</script>

</body>
</html>
